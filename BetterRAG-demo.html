<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetterRAG · 自演进知识库 Agent · 演示</title>
<style>
/* ============================================================
   BetterRAG demo — Swiss / International Typographic Style
   原则：网格 · 发丝线 · 平面纯色 · 严格字阶 · 单一强调色 · 无装饰
   ============================================================ */
:root{
  --bg:#0B0B0C; --bg-2:#0E0E10; --panel:#101012; --panel-2:#141417;
  --rule:#26262B; --rule-2:#3A3A42; --rule-3:#4A4A54;
  --ink:#FFFFFF; --ink-2:#A2A2AB; --ink-3:#6B6B75; --ink-4:#4A4A52;
  --accent:#E8352B;
  --z-stable:#F0C020; --z-prelim:#3D8BFD; --z-learn:#2FBF87;
  --z-pending:#FF8A3D; --z-hold:#FF5C4D; --z-arch:#4A4A52;
  --f:Inter,"Helvetica Neue",Helvetica,"PingFang SC","Microsoft YaHei","Source Han Sans SC",Arial,sans-serif;
  --m:"JetBrains Mono","SF Mono","Cascadia Mono",Consolas,ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f);
  font-size:13.5px;line-height:1.6;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column}

/* ---------- 通用排版原子 ---------- */
.meta{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.num{font-family:var(--m);font-variant-numeric:tabular-nums}
hr.r{border:0;border-top:1px solid var(--rule);margin:0}

/* ---------- header ---------- */
header{display:flex;align-items:stretch;flex:0 0 auto;border-bottom:1px solid var(--rule);
  background:var(--bg);white-space:nowrap;overflow:hidden;height:56px}
.h-brand{display:flex;flex-direction:column;justify-content:center;padding:0 20px;flex:0 0 auto;
  border-right:1px solid var(--rule);min-width:236px}
.h-brand b{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.h-brand span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin-top:2px;font-weight:600}
.h-shots{display:flex;align-items:stretch;flex:0 1 auto;overflow:hidden}
.h-shots button{font-family:var(--f);font-size:11.5px;font-weight:600;color:var(--ink-3);cursor:pointer;
  background:transparent;border:0;border-right:1px solid var(--rule);padding:0 13px;
  display:flex;align-items:center;gap:7px;transition:color .12s,background .12s;white-space:nowrap}
.h-shots button i{font-style:normal;font-family:var(--m);font-size:10px;color:var(--ink-4)}
.h-shots button:hover{color:var(--ink);background:var(--panel-2)}
.h-shots button.on{color:var(--bg);background:var(--ink);font-weight:700}
.h-shots button.on i{color:rgba(0,0,0,.5)}
.h-clock{margin-left:auto;display:flex;align-items:stretch;flex:0 0 auto}
.h-clock .kv{display:flex;flex-direction:column;justify-content:center;padding:0 16px;
  border-left:1px solid var(--rule);text-align:right}
.h-clock .kv i{font-style:normal;font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.h-clock .kv b{font-family:var(--m);font-size:16px;font-weight:600;color:var(--ink);line-height:1.3}
.h-clock .kv b.sm{font-size:11.5px;color:var(--ink-2);font-family:var(--f);font-weight:600}
.h-live{display:flex;align-items:center;gap:7px;padding:0 16px;border-left:1px solid var(--rule)}
.h-live i{width:6px;height:6px;background:var(--z-learn);animation:bl 1.8s steps(1,end) infinite}
@keyframes bl{0%,55%{opacity:1}56%,100%{opacity:.22}}
.h-live span{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* ---------- 论证阶梯（横带） ---------- */
#ladder{display:flex;align-items:stretch;flex:0 0 auto;border-bottom:1px solid var(--rule);
  background:var(--bg-2);height:52px}
.stage{display:flex;align-items:center;gap:10px;padding:0 18px;flex:0 1 auto;min-width:0;
  border-right:1px solid var(--rule);position:relative}
.stage .s-num{font-family:var(--m);font-size:11px;color:var(--ink-4);font-weight:600}
.stage .s-key{font-size:13.5px;font-weight:700;color:var(--ink-4);letter-spacing:.02em}
.stage .s-desc{font-size:11px;color:var(--ink-4);overflow:hidden;text-overflow:ellipsis}
.stage .s-range{margin-left:auto;font-family:var(--m);font-size:9.5px;color:var(--ink-4);
  flex:0 0 auto;padding-left:10px}
.stage.done .s-key{color:var(--ink-3)} .stage.done .s-num{color:var(--ink-3)}
.stage.done .s-desc{color:var(--ink-4)}
.stage.done .s-range{color:var(--ink-3)}
.stage.now{background:var(--panel-2)}
.stage.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
.stage.now::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:var(--accent);
  width:var(--prog,0%);transition:width .4s ease-out}
.stage.now .s-num{color:var(--accent)} .stage.now .s-key{color:var(--ink)}
.stage.now .s-desc{color:var(--ink-2)} .stage.now .s-range{color:var(--accent)}
#ladder .spacer{flex:1 1 auto;border-right:1px solid var(--rule)}
#ladder .l-hint{display:flex;align-items:center;padding:0 18px;font-size:11px;color:var(--ink-3)}

/* ---------- 三栏网格 ---------- */
main{flex:1 1 auto;display:grid;grid-template-columns:352px 1fr 344px;min-height:0}
aside{overflow:hidden;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
#left{border-right:1px solid var(--rule)}
#right{border-left:1px solid var(--rule)}
.colhead{flex:0 0 auto;display:flex;align-items:center;gap:9px;height:30px;padding:0 16px;
  border-bottom:1px solid var(--rule);background:var(--bg-2)}
.colhead .cn{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.colhead .cd{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);font-weight:600}
.colbody{flex:1 1 auto;overflow-y:auto;min-height:0}
.colbody::-webkit-scrollbar{width:8px}
.colbody::-webkit-scrollbar-thumb{background:var(--rule-2)}
.colbody::-webkit-scrollbar-track{background:var(--bg-2)}

#stage{position:relative;min-height:0;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;position:relative;z-index:1;
  transition:opacity .28s ease-out}
#stage.focus canvas{opacity:.58}
.stage-tag{position:absolute;top:12px;left:16px;display:flex;align-items:center;gap:8px;pointer-events:none}
.stage-tag .st{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-4);font-weight:700}
.stage-tag .sn{font-size:9.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;
  border-left:1px solid var(--rule-2);padding-left:9px;margin-left:1px}

/* ---------- 叙事块 ---------- */
.narr{padding:16px 16px 0}
.narr .eyebrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.narr .eyebrow .lv{font-family:var(--m);font-size:10px;font-weight:700;color:var(--bg);
  background:var(--accent);padding:2px 6px}
.narr h1{font-size:25px;font-weight:700;line-height:1.22;letter-spacing:-.015em;margin-bottom:4px}
.narr .sub{font-size:11.5px;color:var(--ink-3);margin-bottom:14px}
.narr .sub b{color:var(--ink-2);font-weight:600}

.logic{border-top:1px solid var(--rule)}
.logic .row{display:grid;grid-template-columns:52px 1fr;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--rule)}
.logic .row .lab{font-size:9.5px;letter-spacing:.1em;color:var(--ink-4);font-weight:700;padding-top:2px}
.logic .row .val{font-size:12.5px;line-height:1.62;color:var(--ink-2)}
.logic .row.q .val{color:var(--ink);font-weight:600;font-size:13.5px}
.logic .row.take .val{color:var(--ink);font-size:13px}
.logic .row.take .val b{color:var(--z-stable)}
.logic .row.innov{background:rgba(232,53,43,.06);margin:0 -16px;padding:11px 16px;
  border-bottom:1px solid var(--rule)}
.logic .row.innov .lab{color:var(--accent)}
.logic .row.innov .val{color:var(--ink)}
.logic .row.innov .val em{font-style:normal;font-weight:700;color:var(--accent);
  font-family:var(--m);font-size:11px;letter-spacing:.04em;margin-right:7px}
.logic .row.innov .val i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);
  margin-top:4px;line-height:1.55}
.logic .row.contra .val{color:var(--ink-3);font-size:11.5px}

.sect{padding:12px 16px 0}
.sect > .meta{margin-bottom:9px;display:block}
ol.steps{list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 26px;font-size:12px;
  line-height:1.6;color:var(--ink-2);border-bottom:1px solid var(--rule)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:9px;
  font-family:var(--m);font-size:10px;color:var(--ink-4);font-weight:600}
ol.steps li b{color:var(--ink);font-weight:600}

/* 管理员导入清单（紧凑两列） */
.implist{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px}
.implist div{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-2);
  overflow:hidden;white-space:nowrap}
.implist div span{overflow:hidden;text-overflow:ellipsis}
.implist i{width:8px;height:8px;flex:0 0 auto}
.implist em{font-style:normal;font-family:var(--m);font-size:9px;color:var(--ink-4);margin-left:auto;flex:0 0 auto}

/* 台账：可点击展开任一条，重看它的「我们怎么做 / 常见做法」 */
.ledger .li{cursor:pointer}
.ledger .li:hover{background:rgba(255,255,255,.035)}
.ledger .li.now:hover{background:rgba(232,53,43,.11)}
.ledbtn{margin-left:auto;background:transparent;border:1px solid var(--rule-2);color:var(--ink-4);
  font-family:var(--f);font-size:9px;letter-spacing:.08em;padding:2px 7px;cursor:pointer;font-weight:700;
  white-space:nowrap}
.ledbtn:hover{color:var(--ink);border-color:var(--rule-3)}
.ledbtn.on{color:var(--accent);border-color:rgba(232,53,43,.5)}
.colhead .cn{flex:0 0 auto} .colhead .cd{flex:0 0 auto}
#tip{position:absolute;pointer-events:none;z-index:14;display:none;background:var(--panel-2);
  border:1px solid var(--rule-2);padding:8px 11px;max-width:280px}
#tip.on{display:block}
#tip b{display:block;font-size:12px;font-weight:700;color:var(--ink);margin-bottom:5px;line-height:1.35}
#tip .r{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2)}
#tip .r i{width:9px;height:9px;flex:0 0 auto}
#tip .r em{font-style:normal;font-family:var(--m);font-size:11px;color:var(--ink);margin-left:auto}
#tip .r2{font-size:10px;color:var(--ink-3);margin-top:5px;padding-top:5px;border-top:1px solid var(--rule)}
#tip .r3{font-size:9.5px;color:var(--accent);margin-top:5px;letter-spacing:.04em}

/* 阶段检查点 */
.check{margin:12px -16px;padding:12px 16px 14px;background:var(--panel-2);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);border-left:3px solid var(--accent)}
.check.done{border-left-color:var(--z-learn)}
.ch-h{font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);
  font-weight:700;margin-bottom:11px}
.ch-h em{font-style:normal;color:var(--accent);letter-spacing:.08em}
.check.done .ch-h em{color:var(--z-learn)}
.ch-s{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);
  font-weight:700;margin:11px 0 6px}
.ch-h + .ch-s{margin-top:0}
.ch-q{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.55}
.ch-l{list-style:none;margin-top:2px}
.ch-l li{position:relative;padding:3.5px 0 3.5px 16px;font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.ch-l li::before{content:"—";position:absolute;left:0;color:var(--ink-4)}
.ch-l.ok li{color:var(--ink-2)}
.ch-l.ok li::before{content:"✓";color:var(--z-learn);font-weight:700}

/* 图例（紧凑色片行，为检查点让出空间） */
.legend .chips{display:flex;flex-wrap:wrap;gap:7px 14px}
.legend .chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.legend .chip i{width:10px;height:10px;flex:0 0 auto}
.legend .chip em{font-style:normal;font-family:var(--m);font-size:9.5px;color:var(--ink-4)}
.legend .note{font-size:10px;color:var(--ink-4);line-height:1.65;padding:9px 0 0}
.legend .note em{font-style:normal;color:var(--ink-3)}

/* 创新台账 */
.ledger .li{display:grid;grid-template-columns:20px 1fr;gap:10px;padding:8px 16px;
  border-bottom:1px solid var(--rule);opacity:.42;transition:opacity .3s}
.ledger .li .bx{font-family:var(--m);font-size:12px;color:var(--ink-4);line-height:1.45}
.ledger .li .nm{font-size:12.5px;font-weight:600;color:var(--ink-2);line-height:1.45}
.ledger .li .ds{font-size:10.5px;color:var(--ink-4);line-height:1.55;margin-top:3px}
.ledger .li.on{opacity:1}
.ledger .li.on .bx{color:var(--accent)}
.ledger .li.on .nm{color:var(--ink)}
.ledger .li.now{background:rgba(232,53,43,.07);padding:11px 16px 13px}
.ledger .li.now .ds{color:var(--ink-2);font-size:11px;margin-top:5px}
.ledger .li .ct{display:flex;gap:7px;margin-top:6px;font-size:10px;line-height:1.5;color:var(--ink-4)}
.ledger .li .ct em{font-style:normal;font-family:var(--m);font-size:8.5px;color:var(--accent);
  border:1px solid rgba(232,53,43,.45);padding:0 4px;flex:0 0 auto;height:14px;line-height:12px;margin-top:1px}

/* 体检 */
.vitals .vr{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:10px;
  padding:6px 16px;border-bottom:1px solid var(--rule);font-size:11.5px;color:var(--ink-3)}
.vitals .vr b{font-family:var(--m);font-size:13px;font-weight:600;color:var(--ink)}
.vitals .vr b.y{color:var(--z-stable)} .vitals .vr b.b{color:var(--z-prelim)}
.vitals .vr b.g{color:var(--z-learn)} .vitals .vr b.r{color:var(--accent)}

/* 审计链 */
.ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 16px;
  border-bottom:1px solid var(--rule);font-size:11px;line-height:1.55}
.ev .d{font-family:var(--m);font-size:10px;color:var(--ink-4);padding-top:2px}
.ev .tt{font-family:var(--m);font-size:9.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-3);
  display:block;margin-bottom:3px}
.ev .nt{color:var(--ink-3)}
.ev .nt b{color:var(--ink-2);font-weight:600}
.ev.hi .tt{color:var(--accent)}
.ev.hi{background:rgba(232,53,43,.05)}

/* ---------- overlay pane ---------- */
#ov{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;
  justify-content:center;padding:0 22px 22px;z-index:10}
#ov>*{pointer-events:auto}
.pane{background:var(--panel);border:1px solid var(--rule-2);width:100%;max-width:860px;
  animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pane-h{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--rule);
  background:var(--panel-2)}
.pane-h .lv{font-family:var(--m);font-size:10px;font-weight:700;color:var(--bg);background:var(--accent);
  padding:2px 6px;flex:0 0 auto}
.pane-h h2{font-size:16.5px;font-weight:700;letter-spacing:-.01em;flex:1 1 auto}
.pane-b{padding:18px 20px 20px}
.pane .sub{font-size:12.5px;color:var(--ink-3);line-height:1.7;margin-bottom:15px}
.pane .sub b{color:var(--ink-2)}
.tag{font-family:var(--m);font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);
  border:1px solid var(--rule-2);padding:2px 7px;flex:0 0 auto}
.tag.r{color:var(--accent);border-color:var(--accent)}
.tag.y{color:var(--z-stable);border-color:rgba(240,192,32,.5)}
.tag.b{color:var(--z-prelim);border-color:rgba(61,139,253,.5)}
.tag.g{color:var(--z-learn);border-color:rgba(47,191,135,.5)}

.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px;
  padding-top:15px;border-top:1px solid var(--rule)}
.btn{font-family:var(--f);font-size:12.5px;font-weight:600;cursor:pointer;padding:9px 16px;
  border:1px solid var(--rule-2);background:transparent;color:var(--ink);transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel-2);border-color:var(--rule-3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.btn.pri:hover{background:#DCDCE0;border-color:#DCDCE0}
.btn.dan{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.btn.dan:hover{background:#C82A21;border-color:#C82A21}
.btn:disabled{opacity:.32;cursor:not-allowed}
.hint{font-size:11px;color:var(--ink-4);flex:1 1 auto;min-width:120px}

/* 双栏对比 */
.duel{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule-2);margin-bottom:16px}
.duel > div{padding:14px 16px}
.duel > div:first-child{border-right:1px solid var(--rule-2)}
.duel .dh{display:flex;align-items:center;gap:9px;margin-bottom:10px;padding-bottom:9px;
  border-bottom:1px solid var(--rule)}
.duel .dh b{font-size:13px;font-weight:700}
.duel .dh .mk{width:9px;height:9px;flex:0 0 auto}
.duel .da{font-size:12.5px;line-height:1.78;color:var(--ink-2)}
.duel .df{font-family:var(--m);font-size:10.5px;color:var(--ink-4);margin-top:11px;
  padding-top:9px;border-top:1px solid var(--rule)}

/* 案卷 */
.dossier{list-style:none;border-top:1px solid var(--rule)}
.dossier li{display:grid;grid-template-columns:20px 1fr;gap:9px;padding:9px 0;font-size:12px;
  line-height:1.62;color:var(--ink-2);border-bottom:1px solid var(--rule)}
.dossier li .g{font-family:var(--m);font-size:10px;color:var(--ink-4);padding-top:2px}
.dossier li.warn .g{color:var(--accent)}

/* 数据板 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule-2)}
.grid2 > div{padding:13px 15px}
.grid2 > div:first-child{border-right:1px solid var(--rule-2)}
.grid2 h4{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);
  font-weight:700;margin-bottom:8px}
.grid2 .big{font-family:var(--m);font-size:24px;font-weight:600;line-height:1.1}
.grid2 p{font-size:11.5px;color:var(--ink-3);line-height:1.7;margin-top:7px}

/* 红灯横幅 */
#alert{position:absolute;top:0;left:0;right:0;z-index:20;display:none;align-items:center;gap:14px;
  padding:12px 20px;background:var(--accent);color:#fff}
#alert.on{display:flex}
#alert .ic{font-family:var(--m);font-size:11px;font-weight:700;letter-spacing:.14em;
  border:1px solid rgba(255,255,255,.6);padding:2px 7px;flex:0 0 auto}
#alert b{font-size:14px;font-weight:700} #alert span{font-size:12px;color:rgba(255,255,255,.86)}

/* 传记 */
.bio .yr{font-family:var(--m);font-size:11.5px;color:var(--ink-3);padding:10px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:15px;letter-spacing:.02em}
.bio .st{font-size:13px;line-height:1.95;color:var(--ink-2)}
.bio .st b{color:var(--z-stable);font-weight:600}

/* 下钻抽屉：点星图节点看「一条知识的一生」 */
#drawer{position:absolute;top:0;right:0;bottom:0;width:392px;background:var(--panel);
  border-left:1px solid var(--rule-2);display:none;flex-direction:column;z-index:16}
#drawer.on{display:flex;animation:dfade .18s ease-out}
@keyframes dfade{from{opacity:0}to{opacity:1}}
.dr-h{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:34px;
  border-bottom:1px solid var(--rule);background:var(--panel-2)}
.dr-h .dr-t{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700;flex:1 1 auto}
.dr-h button{background:transparent;border:0;color:var(--ink-3);cursor:pointer;font-size:13px;
  font-family:var(--f);padding:2px 4px}
.dr-h button:hover{color:var(--ink)}
.dr-b{flex:1 1 auto;overflow-y:auto;padding:16px}
.dr-b::-webkit-scrollbar{width:8px}
.dr-b::-webkit-scrollbar-thumb{background:var(--rule-2)}
.dr-title{font-size:17px;font-weight:700;line-height:1.3;letter-spacing:-.01em}
.dr-sub{font-size:11px;color:var(--ink-4);margin-top:5px}
.dr-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dr-sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);
  font-weight:700;margin:18px 0 9px;padding-top:11px;border-top:1px solid var(--rule)}
.dr-sum{font-size:12px;line-height:1.72;color:var(--ink-2);margin-top:12px;
  padding:11px 12px;background:var(--panel-2);border-left:2px solid var(--rule-3)}
.dr-ev{display:grid;grid-template-columns:44px 1fr;gap:9px;padding:7px 0;font-size:11px;
  line-height:1.5;border-bottom:1px solid var(--rule)}
.dr-ev .d{font-family:var(--m);font-size:10px;color:var(--ink-4)}
.dr-ev .tt{font-family:var(--m);font-size:9.5px;font-weight:700;color:var(--ink-3);display:block;margin-bottom:2px}
.dr-ev .nt{color:var(--ink-3)}
.hintbar{position:absolute;bottom:12px;left:16px;font-size:10.5px;color:var(--ink-4);
  pointer-events:none;z-index:5}
.hintbar b{color:var(--ink-3);font-weight:600}

footer{flex:0 0 auto;border-top:1px solid var(--rule);background:var(--bg);height:64px;
  display:flex;flex-direction:column;justify-content:center;padding:0 20px}
.tl{display:flex;align-items:center;gap:14px}
.tl .btn{padding:6px 13px;font-size:11.5px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;height:20px;background:transparent;
  outline:none;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--rule-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:16px;background:var(--accent);
  border:0;border-radius:0;margin-top:-8px}
.speed{display:flex;border:1px solid var(--rule-2)}
.speed button{font-family:var(--m);font-size:10.5px;padding:5px 9px;cursor:pointer;background:transparent;
  border:0;border-right:1px solid var(--rule-2);color:var(--ink-4);font-weight:600}
.speed button:last-child{border-right:0}
.speed button.on{background:var(--ink);color:var(--bg)}
.ticks{position:relative;height:14px;margin-top:2px}
.ticks i{position:absolute;top:0;width:1px;height:5px;background:var(--rule-3)}
.ticks u{position:absolute;top:6px;font-size:9px;color:var(--ink-4);text-decoration:none;
  transform:translateX(-50%);font-family:var(--m);white-space:nowrap;letter-spacing:.03em}
.ticks u.acc{color:var(--accent)}
</style>
</head>

    <div class="h-shots" id="shots"></div>
    <div class="h-clock">
      <div class="h-live"><i></i><span>Clock</span></div>
      <div class="kv"><i>Virtual day</i><b id="day">0</b></div>

  <div id="ladder"></div>

    </section>
    <aside id="right">
      <div class="colhead"><span class="cn">证据</span><span class="cd">Evidence</span></div>
      <div class="colbody" id="rightBody"></div>
    </aside>
  </main>
  <footer>
    <div class="tl">

      </div>
    </div>
    <div class="ticks" id="ticks"></div>
  </footer>
</div>

const B = TL.blocks, ST = TL.story, META = TL.meta;
const FR = TL.frames;

const DAY0 = FR[0][0], DAYN = FR[FR.length - 1][0];
const BR = TL.branches;

let branch = null;

/* 采样：在两天之间线性插值 eff，分区取最近帧；eff<0 表示该块尚未入库（不可见） */
function sample(day) {
  const fr = AF, ix = AI;
  const d = Math.max(fr[0][0], Math.min(fr[fr.length - 1][0], day));
  const lo = Math.floor(d), hi = Math.min(fr[fr.length - 1][0], lo + 1);
  const a = ix.has(lo) ? ix.get(lo) : 0, b = ix.has(hi) ? ix.get(hi) : a;
  const fa = fr[a][1], fb = fr[b][1], t = (hi === lo) ? 0 : (d - lo) / (hi - lo);
  const out = [];
  for (let i = 0; i < B.length; i++) {
    const ra = fa[i], rb = fb[i];
    const near = (t < .5 ? ra : rb) || ra || rb;
    if (!near || near[1] < 0) { out.push({ eff: -1, zone: 0, flags: 0, hidden: true }); continue; }
    const ea = (ra && ra[1] >= 0) ? ra[1] : 0, eb = (rb && rb[1] >= 0) ? rb[1] : 0;
    out.push({ eff: (ea + (eb - ea) * t) / 1000, zone: near[2], flags: near[3], hidden: false });
  }
  return out;
}

const RULE = '#26262B', RULE2 = '#3A3A42', INK3 = '#6B6B75', INK4 = '#4A4A52';
/* 半径映射：到中心的距离 = 信任度（稳定区在核心） */
const radiusOf = e => e >= .75 ? .44 - (e - .75) / .25 * .28
  : e >= .60 ? .66 - (e - .60) / .15 * .22
    : 1.00 - Math.max(0, e - .05) / .55 * .34;
const RINGS = [.05, .60, .75];            // 分区边界（废弃线 / 举证期门槛 / 稳定区下界）
const NODE_R = e => 6.2 + Math.max(0, (e - .6)) * 4.0;   // 投影可读性优先

/* ============================================================ 画布 */
const cv = document.getElementById('map'), cx2 = cv.getContext('2d');
let W = 0, H = 0, CX = 0, CY = 0, R = 0, DPR = Math.min(2, devicePixelRatio || 1);
let CY0 = 0, R0 = 0, cyShift = 0, CX0 = 0, cxShift = 0;
function resize() {
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx2.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX0 = W / 2; CX = CX0; CY0 = H / 2; CY = CY0; R0 = Math.min(W, H) * .43; R = R0;
}
addEventListener('resize', resize);

const N = B.map((b, i) => ({
  i, id: b.id, ang: (b.angle * Math.PI) / 180, jit: b.jitter,
  x: 0, y: 0, eff: 0, zone: 0, flags: 0, r: 0, prevZone: -1, flash: 0, hidden: true,
}));
let FX = [];
let spawnQuiet = true;   // 首屏不做「新入库」脉冲（它们不是事件，只是初始状态）
let hoverIdx = -1, drillIdx = -1;

/* ============================================================ 时间推进 */
let curDay = -1, targetDay = -1, speed = 1, playing = false, sweep = null;
const EASE = 3.1;
function animateTo(day) { targetDay = day; }
function jump(day) { curDay = targetDay = day; sweep = null; }
function playSweep(from, to, dur) { jump(from); sweep = { from, to, dur, t: 0 }; }

/* ============================================================ 绘制（极坐标图表） */
function draw(dt) {
  if (targetDay >= 0 && Math.abs(targetDay - curDay) > .05) {
    curDay += (targetDay - curDay) * (1 - Math.exp(-EASE * dt));
  } else if (targetDay >= 0) curDay = targetDay;

  const s = sample(curDay);
  const kc = 1 - Math.exp(-6 * dt);
  CX += ((CX0 + cxShift) - CX) * kc;
  CY += ((CY0 + cyShift) - CY) * kc;
  R += ((R0 * (cyShift ? .795 : 1)) - R) * kc;
  cx2.clearRect(0, 0, W, H);
  cx2.lineCap = 'butt';

  drawFrame();
  drawConflicts();
  drawNodes(dt, s);
  drawLabels();
  drawFX(dt);
}

/* --- 坐标系统：十字轴 + 分区环 + 半径刻度 --- */
function drawFrame() {
  // 十字轴（发丝线）
  cx2.strokeStyle = RULE; cx2.lineWidth = 1;
  cx2.beginPath();
  cx2.moveTo(CX - R * 1.06, CY + .5); cx2.lineTo(CX + R * 1.06, CY + .5);
  cx2.moveTo(CX + .5, CY - R * 1.06); cx2.lineTo(CX + .5, CY + R * 1.06);
  cx2.stroke();

  // 分区环
  RINGS.forEach(v => {
    const rr = radiusOf(v) * R;
    cx2.strokeStyle = RULE2; cx2.lineWidth = 1;
    cx2.beginPath(); cx2.arc(CX, CY, rr, 0, 7); cx2.stroke();
  });
  // 外圈 + 仪器刻度（72 格，每 6 格长刻度）
  cx2.strokeStyle = RULE; cx2.beginPath(); cx2.arc(CX, CY, R, 0, 7); cx2.stroke();
  for (let i = 0; i < 72; i++) {
    const a = (i / 72) * Math.PI * 2, long = i % 6 === 0;
    const r1 = R, r0 = R - (long ? 9 : 4);
    cx2.strokeStyle = long ? RULE2 : RULE;
    cx2.beginPath();
    cx2.moveTo(CX + Math.cos(a) * r0, CY + Math.sin(a) * r0);
    cx2.lineTo(CX + Math.cos(a) * r1, CY + Math.sin(a) * r1);
    cx2.stroke();
  }

  // 半径刻度：在 210° 方向画刻度并标注数值（只标三个分区边界）
  const a = Math.PI * 1.166;
  const ax = Math.cos(a), ay = Math.sin(a);
  RINGS.forEach(v => {
    const rr = radiusOf(v) * R;
    const px = CX + ax * rr, py = CY + ay * rr;
    cx2.strokeStyle = RULE2; cx2.lineWidth = 1;
    cx2.beginPath();
    cx2.moveTo(px - ay * 4, py + ax * 4); cx2.lineTo(px + ay * 4, py - ax * 4);
    cx2.stroke();
    cx2.fillStyle = v === .60 ? INK3 : INK4;
    cx2.font = '600 9.5px "JetBrains Mono",Consolas,monospace';
    cx2.textAlign = 'right'; cx2.textBaseline = 'middle';
    cx2.fillText(v.toFixed(2), px - 9, py);
  });

  // 中心原点
  cx2.fillStyle = INK4;
  cx2.fillRect(CX - 3, CY - .5, 6, 1);
  cx2.fillRect(CX - .5, CY - 3, 1, 6);
}

/* --- 冲突连线 --- */
function drawConflicts() {
  const pairs = [[META.duelDay - 3, 'pkg-4g-data', 'notice-4g-stop'],
  [META.amendDay - 1, 'iron-billing', 'dir-adjust']];
  pairs.forEach(([d, a, b]) => {
    if (curDay < d || curDay > d + 110) return;
    const na = N[B.findIndex(x => x.id === a)], nb = N[B.findIndex(x => x.id === b)];
    if (na.hidden || nb.hidden) return;
    const t = Math.min(1, (curDay - d) / 2);
    cx2.strokeStyle = 'rgba(232,53,43,' + (.85 * t) + ')';
    cx2.lineWidth = 1;
    cx2.beginPath(); cx2.moveTo(na.x, na.y); cx2.lineTo(nb.x, nb.y); cx2.stroke();
    // 冲突计数方块（放在中点，显示计数）
    const mx = (na.x + nb.x) / 2, my = (na.y + nb.y) / 2, k = 6;
    cx2.fillStyle = '#E8352B';
    cx2.fillRect(mx - k, my - k, k * 2, k * 2);
    cx2.fillStyle = '#0B0B0C';
    cx2.font = '700 10px "JetBrains Mono",Consolas,monospace';
    cx2.textAlign = 'center'; cx2.textBaseline = 'middle';
    cx2.fillText('3', mx, my + .5);
  });
}

/* --- 节点：形状编码 --- */
function drawNodes(dt, s) {
  N.forEach(n => {
    const v = s[n.i]; if (!v) return;
    if (v.hidden) { if (!n.hidden) { n.hidden = true; n.prevZone = -1; } n.eff = 0; return; }
    const arch = v.zone === 4;
    const rr = radiusOf(Math.max(v.eff, .05)) + (arch ? .18 : 0);
    const tx = CX + Math.cos(n.ang) * R * (rr + n.jit);
    const ty = CY + Math.sin(n.ang) * R * (rr + n.jit);
    if (n.hidden) {
      n.x = tx; n.y = ty; n.eff = v.eff; n.zone = v.zone; n.flags = v.flags;
      n.hidden = false; n.prevZone = v.zone; n.flash = 1;
      n.r = NODE_R(n.eff);
      if (!spawnQuiet) FX.push({ x: tx, y: ty, t: 0, life: .75, k: 5, c: C[v.zone].fill });
      return;
    }
    const settled = Math.abs(targetDay - curDay) < .5;
    const k = 1 - Math.exp(-7 * dt), kEff = 1 - Math.exp(-(settled ? 26 : 7) * dt);
    n.x += (tx - n.x) * k; n.y += (ty - n.y) * k;
    n.eff += (v.eff - n.eff) * kEff; n.zone = v.zone; n.flags = v.flags;
    if (n.prevZone !== v.zone) {
      if (n.prevZone >= 0 && !spawnQuiet) FX.push({ x: n.x, y: n.y, t: 0, life: .75, k: 5, c: C[v.zone].fill });
      n.prevZone = v.zone; n.flash = 1;
    }
    n.flash = Math.max(0, n.flash - dt * 2.6);
    n.r = NODE_R(n.eff);
  });

  // 实体
  const FS = (drillIdx < 0) ? focusSet() : new Set();
  N.forEach(n => {
    if (n.hidden) return;
    const c = C[n.zone], r = n.r, arch = n.zone === 4;
    const dim = FS.size > 0 && !FS.has(n.id);
    cx2.save();
    if (arch) cx2.globalAlpha = .55;
    if (dim) cx2.globalAlpha *= .38;
    // 举证期：细外环
    if (n.flags & 1) {
      cx2.strokeStyle = 'rgba(61,139,253,.85)'; cx2.lineWidth = 1;
      cx2.beginPath(); cx2.arc(n.x, n.y, r + 4, 0, 7); cx2.stroke();
    }
    cx2.fillStyle = c.fill; cx2.strokeStyle = c.fill; cx2.lineWidth = 1.4;
    if (arch) {                              // 归档 = 空心圆
      cx2.beginPath(); cx2.arc(n.x, n.y, r, 0, 7); cx2.stroke();
    } else if (n.flags & 8) {                // 铁律 = 方块
      const k = r * 1.15;
      cx2.fillRect(n.x - k, n.y - k, k * 2, k * 2);
      cx2.strokeStyle = 'rgba(240,192,32,.4)'; cx2.lineWidth = 1;
      cx2.strokeRect(n.x - k - 3.5, n.y - k - 3.5, (k + 3.5) * 2, (k + 3.5) * 2);
    } else if (n.flags & 4) {                // 挂起 = 三角
      const k = r * 1.25;
      cx2.beginPath();
      cx2.moveTo(n.x, n.y - k); cx2.lineTo(n.x + k * .92, n.y + k * .7);
      cx2.lineTo(n.x - k * .92, n.y + k * .7); cx2.closePath(); cx2.fill();
    } else {                                 // 常规 = 圆
      cx2.beginPath(); cx2.arc(n.x, n.y, r, 0, 7); cx2.fill();
    }
    // 例外队列：右侧红色小方块
    if (n.flags & 32) { cx2.fillStyle = '#E8352B'; cx2.fillRect(n.x + r + 4, n.y - 6, 5, 5); }
    // 悬停 / 下钻选中：细方框
    if (n.i === drillIdx || n.i === hoverIdx) {
      const k = r + 7;
      cx2.strokeStyle = n.i === drillIdx ? '#E8352B' : 'rgba(255,255,255,.7)';
      cx2.lineWidth = 1;
      cx2.strokeRect(n.x - k, n.y - k, k * 2, k * 2);
    }
    // 本镜焦点：四角标记（把观众的眼睛引到这里）
    if (FS.has(n.id)) {
      const k = r + 11, L = k * .5;
      cx2.strokeStyle = '#E8352B'; cx2.lineWidth = 1.5;
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
        cx2.beginPath();
        cx2.moveTo(n.x + sx * k, n.y + sy * k - sy * L);
        cx2.lineTo(n.x + sx * k, n.y + sy * k);
        cx2.lineTo(n.x + sx * k - sx * L, n.y + sy * k);
        cx2.stroke();
      });
    }
    cx2.restore();
  });
}

/* --- 引导线 + 标签 --- */
function drawLabels() {
  const FS = (drillIdx < 0) ? focusSet() : new Set();
  const show = N.filter(n => !n.hidden && (n.zone !== 4 || n.eff > .01));
  show.forEach(n => {
    const c = C[n.zone];
    const isF = FS.has(n.id);
    const dim = FS.size > 0 && !isF;
    const major = !dim && (n.zone === 2 || n.zone === 3 || n.zone === 5 || (n.flags & (1 | 4 | 8 | 32)) || isF);
    const dx = Math.cos(n.ang), dy = Math.sin(n.ang);
    const r0 = n.r + 4, r1 = n.r + 13;
    // 引导线
    cx2.strokeStyle = major ? RULE2 : RULE; cx2.lineWidth = 1;
    cx2.beginPath();
    cx2.moveTo(n.x + dx * r0, n.y + dy * r0);
    cx2.lineTo(n.x + dx * r1, n.y + dy * r1);
    cx2.stroke();

    let al = dx > .30 ? 'left' : (dx < -.30 ? 'right' : 'center');
    let lx = n.x + dx * (r1 + 4), ly = n.y + dy * (r1 + 4);
    // 边缘避让
    if (al === 'left' && lx > W - 118) al = 'right';
    if (al === 'right' && lx < 118) al = 'left';
    lx = Math.max(8, Math.min(W - 8, lx));
    const bl = dy > .30 ? 'top' : (dy < -.30 ? 'bottom' : 'middle');
    ly = Math.max(14, Math.min(H - 14, ly));
    cx2.textAlign = al; cx2.textBaseline = bl;
    cx2.fillStyle = dim ? 'rgba(120,120,130,.30)'
      : (isF ? 'rgba(255,255,255,1)' : (major ? 'rgba(255,255,255,.94)' : 'rgba(162,162,171,.62)'));
    cx2.font = ((major || isF) ? '600 13px ' : '500 11.5px ') + 'Inter,"PingFang SC","Microsoft YaHei",sans-serif';
    cx2.fillText(B[n.i].title, lx, ly);
    if (major) {
      const tw = cx2.measureText(B[n.i].title).width;
      cx2.fillStyle = c.fill;
      cx2.font = '600 10.5px "JetBrains Mono",Consolas,monospace';
      if (al === 'left') cx2.fillText(n.eff.toFixed(3), lx + tw + 8, ly);
      else if (al === 'right') cx2.fillText(n.eff.toFixed(3), lx - tw - 8, ly);
      else cx2.fillText(n.eff.toFixed(3), lx, ly + (bl === 'bottom' ? -15 : 15));
    }
  });
}

/* --- 状态变化标记：向内收紧的细方框（注册标记），不是光晕 --- */
function drawFX(dt) {
  FX = FX.filter(f => f.t < f.life);
  FX.forEach(f => {
    f.t += dt;
    const p = f.t / f.life, k = (f.k || 5) + (1 - p) * 6;
    cx2.strokeStyle = 'rgba(255,255,255,' + ((1 - p) * .45) + ')';
    cx2.lineWidth = 1;
    cx2.strokeRect(f.x - k, f.y - k, k * 2, k * 2);
  });
}

/* ============================================================ 下钻：一条知识的一生 */
const ZTAG = ['g', 'b', 'y', '', '', 'r'];
function sparkSVG(i) {
  const hist = AF.map(f => { const r = f[1][i]; return r ? r[1] : -1; });
  const Wd = 358, Hd = 78, n = hist.length;
  const X = k => (k / (n - 1)) * Wd, Y = v => Hd - (Math.max(0, Math.min(1000, v)) / 1000) * Hd;
  let seg = [], segs = [];
  hist.forEach((v, k) => {
    if (v < 0) { if (seg.length > 1) segs.push(seg); seg = []; return; }
    seg.push(X(k).toFixed(1) + ',' + Y(v).toFixed(1));
  });
  if (seg.length > 1) segs.push(seg);
  const lines = segs.map(s => `<polyline points="${s.join(' ')}" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>`).join('');
  const guides = [[0.75, '#F0C020'], [0.60, '#3D8BFD'], [0.05, '#4A4A52']].map(([v, c]) =>
    `<line x1="0" y1="${Y(v * 1000).toFixed(1)}" x2="${Wd}" y2="${Y(v * 1000).toFixed(1)}"
      stroke="${c}" stroke-width="1" stroke-dasharray="2 3" opacity=".5"/>`).join('');
  const kn = Math.max(0, Math.min(n - 1, Math.round(((curDay - DAY0) / (DAYN - DAY0)) * (n - 1))));
  const cv0 = hist[kn];
  const mark = cv0 >= 0
    ? `<line x1="${X(kn).toFixed(1)}" y1="0" x2="${X(kn).toFixed(1)}" y2="${Hd}" stroke="#E8352B" stroke-width="1"/>
       <circle cx="${X(kn).toFixed(1)}" cy="${Y(cv0).toFixed(1)}" r="2.8" fill="#E8352B"/>`
    : `<line x1="${X(kn).toFixed(1)}" y1="0" x2="${X(kn).toFixed(1)}" y2="${Hd}" stroke="#E8352B" stroke-width="1" opacity=".4"/>`;
  return `<svg viewBox="0 0 ${Wd} ${Hd}" width="${Wd}" height="${Hd}" style="display:block">${guides}${lines}${mark}</svg>`;
}
function openDrill(i) {
  drillIdx = i; cxShift = -195; hideTip();
  const b = B[i], v = sample(curDay)[i];
  const fl = [];
  if (v.flags & 8) fl.push('<span class="tag y">铁律位</span>');
  if (v.flags & 1) fl.push('<span class="tag b">举证期中</span>');
  if (v.flags & 2) fl.push('<span class="tag">待处置</span>');
  if (v.flags & 4) fl.push('<span class="tag r">保全挂起</span>');
  if (v.flags & 32) fl.push('<span class="tag r">例外队列</span>');
  if (v.flags & 16) fl.push('<span class="tag">已归档</span>');
  const evs = TL.events.filter(e => e.b === b.id && e.d <= curDay).reverse().slice(0, 60);
  const prevBody = $('#drawer .dr-b');
  const keepScroll = prevBody ? prevBody.scrollTop : 0;
  $('#drawer').innerHTML = `
    <div class="dr-h"><span class="dr-t">知识块档案 · Block dossier</span>
      <button id="drClose">✕ 关闭</button></div>
    <div class="dr-b">
      <div class="dr-title">${b.title}</div>
      <div class="dr-sub">${b.admin ? '管理员导入 · 带背书' : 'Agent 收纳 · 原文切片'} · 入库 D${b.created}</div>
      <div class="dr-badges">
        <span class="tag ${ZTAG[v.zone]}">${C[v.zone].name} · ${v.eff >= 0 ? v.eff.toFixed(3) : '未入库'}</span>
        ${fl.join('')}</div>
      <div class="dr-sum">${b.summary}</div>
      <div class="dr-sec">置信度轨迹 · D${DAY0} → D${DAYN}（虚线 = 0.75 / 0.60 / 0.05）</div>
      ${sparkSVG(i)}
      <div class="dr-sec">审计链 · 该块 ${evs.length} 条事件（截至 D${Math.round(curDay)}）</div>
      ${evs.map(e => `<div class="dr-ev"><div class="d">D${e.d}</div><div>
        <span class="tt">${e.t.replace('ADJUDICATE_', 'ADJ_')}</span>
        <span class="nt">${e.note || ''}</span></div></div>`).join('')
      || '<div class="dr-ev"><div class="d">—</div><div class="nt">尚无事件</div></div>'}
    </div>`;
  $('#drawer').classList.add('on');
  $('#drClose').onclick = closeDrill;
  const nb = $('#drawer .dr-b'); if (nb) nb.scrollTop = keepScroll;
}
function closeDrill() { drillIdx = -1; cxShift = 0; $('#drawer').classList.remove('on'); hideTip(); }
/* 悬停即时提示：让「可以点」被发现 */
function showTip(i) {
  const n = N[i], v = sample(curDay)[i], b = B[i], t = $('#tip');
  const fl = [];
  if (v.flags & 8) fl.push('铁律位');
  if (v.flags & 1) fl.push('举证期中');
  if (v.flags & 2) fl.push('待处置');
  if (v.flags & 4) fl.push('保全挂起');
  if (v.flags & 32) fl.push('例外队列');
  if (v.flags & 16) fl.push('已归档');
  t.innerHTML = `<b>${b.title}</b>
    <div class="r"><i style="background:${C[v.zone].fill}"></i>${C[v.zone].name}
      <em>${v.eff >= 0 ? v.eff.toFixed(3) : '—'}</em></div>
    ${fl.length ? `<div class="r2">${fl.join(' · ')}</div>` : ''}
    <div class="r3">点击查看完整档案 →</div>`;
  t.classList.add('on');
  const tw = t.offsetWidth, th = t.offsetHeight;
  let x = n.x + 20, y = n.y - th / 2;
  if (x + tw > W - 8) x = n.x - tw - 20;
  y = Math.max(8, Math.min(H - th - 8, y));
  t.style.left = Math.round(x) + 'px';
  t.style.top = Math.round(y) + 'px';
}
function hideTip() { $('#tip').classList.remove('on'); }

function hitTest(mx, my) {
  for (let i = 0; i < N.length; i++) {
    const n = N[i]; if (n.hidden) continue;
    if (Math.hypot(mx - n.x, my - n.y) < n.r + 9) return i;
  }
  return -1;
}
cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  hoverIdx = hitTest(e.clientX - r.left, e.clientY - r.top);
  cv.style.cursor = hoverIdx >= 0 ? 'pointer' : 'default';
  if (hoverIdx >= 0 && drillIdx < 0) showTip(hoverIdx); else hideTip();
});
cv.addEventListener('mouseleave', () => { hoverIdx = -1; hideTip(); });
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const i = hitTest(e.clientX - r.left, e.clientY - r.top);
  if (i >= 0) { if (i === drillIdx) closeDrill(); else openDrill(i); }
  else closeDrill();
});

/* ============================================================ 主循环 */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (sweep) {
    sweep.t += dt;
    const p = Math.min(1, sweep.t / sweep.dur);
    const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    curDay = targetDay = sweep.from + (sweep.to - sweep.from) * e;
    if (p >= 1) sweep = null;
  }
  if (playing && curDay < DAYN) {
    curDay = Math.min(DAYN, curDay + dt * speed * 2.2);
    targetDay = curDay;
    if (curDay >= DAYN) playing = false;
  }
  draw(dt);
  hud();
  requestAnimationFrame(loop);
}

/* ============================================================ HUD */
const $ = s => document.querySelector(s);
let lastEvDay = null, lastEvAt = 0;
function counts() {
  const s = sample(curDay);
  let g = 0, b = 0, n = 0, ar = 0, tier0 = 0, froz = 0, q = 0;
  s.forEach(v => {
    if (v.hidden) return;
    if (v.zone === 2) g++; else if (v.zone === 1 || v.zone === 3) b++;
    else if (v.zone === 0) n++; else ar++;
    if (v.flags & 8) tier0++; if (v.flags & 1) froz++; if (v.flags & 32) q++;
  });
  return { g, b, n, ar, tier0, froz, q };
}
function hud() {
  $('#day').textContent = (() => { const d = Math.round(curDay); return (d < 0 ? '−' : '') + String(Math.abs(d)).padStart(3, '0'); })();

/* 阶段检查点：由浅入深的路标 —— 进入某层时「前面已确立什么」，离开时「你现在应该能回答什么」 */
const STAGE_SHOTS = { 1: [1, 2], 2: [3, 4], 3: [5, 6, 7, 8], 4: [9, 10] };
const STAGE_TAKE = {
  1: ['知识库只有记忆，没有新陈代谢', '管理员导入让企业第一天就能用', '铁律位不自动降级、冲突必胜'],
  2: ['入库的是原文切片，AI 只贴标签', '采纳只是入场券——零积分', '真实结局才计分，沉默计零'],
  3: ['升降级由系统自动执行，无人点按钮', '人只守一道例外门', '冲突走三级仲裁阶梯', '宪法只能由人修'],
  4: ['一个变量、两种信号、三条规则、一张图', '有效置信度 = 存量 × 新鲜度', '归档不删除，人工可翻案'],
};
function checkpoint(n) {
  const d = NARR[n] || {}, sid = d.stage || 1, st = STAGES[sid - 1];
  const rng = STAGE_SHOTS[sid] || [n, n];
  const isOpen = n === rng[0], isClose = n === rng[rng.length - 1];
  if (!isOpen && !isClose) return '';
  const num = String(sid).padStart(2, '0');
  if (isOpen) {
    const prev = STAGE_TAKE[sid - 1];
    return `<div class="check">
      <div class="ch-h">检查点 · 进入第 ${num} 层 <em>${st.key}</em></div>
      ${prev ? `<div class="ch-s">前面已经确立</div>
        <ul class="ch-l">${prev.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}
      <div class="ch-s">本层要回答</div>
      <div class="ch-q">${st.desc}</div></div>`;
  }
  return `<div class="check done">
    <div class="ch-h">检查点 · 第 ${num} 层完成 <em>${st.key}</em></div>
    <div class="ch-s">你现在应该能回答</div>
    <div class="ch-q">${st.desc}</div>
    <div class="ch-s">答案</div>
    <ul class="ch-l ok">${(STAGE_TAKE[sid] || []).map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}

function renderLadder() {
  const cur = (NARR[curShot] || {}).stage || 1;
  const items = STAGES.map(s => {
    const rng = STAGE_SHOTS[s.id] || [0, 0];
    const prog = s.id === cur
      ? Math.round((rng.indexOf(curShot) + 1) / rng.length * 100) : 0;
    return `
    <div class="stage ${s.id < cur ? 'done' : ''} ${s.id === cur ? 'now' : ''}"
         style="--prog:${prog}%">
      <span class="s-num">${String(s.id).padStart(2, '0')}</span>
      <span class="s-key">${s.key}</span>
      <span class="s-desc">${s.desc}</span>
      <span class="s-range">镜 ${rng[0]}–${rng[rng.length - 1]}</span>
    </div>`;
  }).join('');
  $('#ladder').innerHTML = items +
    `<div class="spacer"></div><div class="l-hint">分镜 ${String(curShot).padStart(2, '0')} / 10</div>`;
  const stn = $('#stageNow');
  if (stn) stn.textContent = `${String(cur).padStart(2, '0')} ${STAGES[cur - 1].key}`;
}

}
function bindRight() {
  const all = $('#ledAll');
  if (all) all.onclick = e => { e.stopPropagation(); ledgerAll = !ledgerAll; renderRight(); };
  document.querySelectorAll('#rightBody .ledger .li').forEach(el => {
    el.onclick = () => {
      const id = +el.dataset.id;
      if (ledgerAll) { ledgerAll = false; ledgerOpen = new Set(INNOV.filter(v => curShot >= v.at).map(v => v.id)); }
      if (ledgerOpen.has(id)) ledgerOpen.delete(id); else ledgerOpen.add(id);
      renderRight();
    };
  });
}

/* ============================================================ 分镜调度 */
let curShot = 0, tourTimer = null;
function goShot(n, instant) {
  const s = SHOTS.find(x => x.n === n); if (!s) return;
  curShot = n;
  closeDrill();
  document.querySelectorAll('#shots button').forEach(b => b.classList.toggle('on', +b.dataset.n === n));
  if (n < 7) { branch = null; AF = FR; AI = IDX; }
  if (n < 8) $('#alert').classList.remove('on');
  if (instant || s.snap) jump(s.from);
  else if (s.anim) { jump(s.from); animateTo(s.to); }
  else if (Math.abs(curDay - s.from) > 1.5) animateTo(s.from);
  else jump(s.from);
  s.go();
  renderLadder();
  seedLedger();
  if (n !== 9) lastEvDay = null;
  renderRight();
}
function autoPlay(fromStart) {
  clearInterval(tourTimer); tourTimer = null;
  const seq = [1, 3, 4, 5, 6, 7, 8, 9, 10];
  let i = fromStart ? 0 : seq.indexOf(curShot) + 1;
  if (i >= seq.length || i < 0) i = 0;
  goShot(seq[i]);
  $('#play').textContent = '⏸ 连播中';
  tourTimer = setInterval(() => {
    i++;
    if (i >= seq.length) { clearInterval(tourTimer); tourTimer = null; $('#play').textContent = '▶ 连播'; return; }
    goShot(seq[i]);
  }, 11000);
}

/* ============================================================ 交互绑定 */
$('#shots').innerHTML = SHOTS.map(s =>
  `<button data-n="${s.n}"><i>${String(s.n).padStart(2, '0')}</i>${s.name}</button>`).join('');
document.querySelectorAll('#shots button').forEach(b =>
  b.onclick = () => { clearInterval(tourTimer); tourTimer = null; $('#play').textContent = '▶ 连播'; goShot(+b.dataset.n); });
$('#slider').oninput = e => { playing = false; jump(DAY0 + (+e.target.value / 1000) * (DAYN - DAY0)); lastEvDay = null; };
$('#play').onclick = () => { if (tourTimer) { clearInterval(tourTimer); tourTimer = null; $('#play').textContent = '▶ 连播'; } else autoPlay(false); };
$('#reset').onclick = () => { clearInterval(tourTimer); tourTimer = null; $('#play').textContent = '▶ 连播'; branch = null; AF = FR; AI = IDX; FX = []; goShot(1, true); };
document.querySelectorAll('#speed button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#speed button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); speed = +b.dataset.s;
});
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '9') goShot(+e.key);
  if (e.key === '0') goShot(10);
  if (e.key === ' ') { e.preventDefault(); playing = !playing; }
  if (e.key === 'ArrowRight') { playing = false; jump(Math.min(DAYN, curDay + 20)); lastEvDay = null; }
  if (e.key === 'ArrowLeft') { playing = false; jump(Math.max(DAY0, curDay - 20)); lastEvDay = null; }
});

/* 时间轴刻度 */
const TICKS = [[-300, '导入'], [0, '演示起点'], [90, '举证期'], [103, '对决'], [109, '接替'], [474, '归档'], [520, '终点']];
$('#ticks').innerHTML = TICKS.map(([d, t]) =>
  `<i style="left:${(d - DAY0) / (DAYN - DAY0) * 100}%"></i>
   <u class="${d === 474 ? 'acc' : ''}" style="left:${(d - DAY0) / (DAYN - DAY0) * 100}%">${t}</u>`).join('');

/* ============================================================ 启动 */
resize();
N.forEach(n => { const r = radiusOf(.85); n.x = CX + Math.cos(n.ang) * R * r; n.y = CY + Math.sin(n.ang) * R * r; });
const _h = (location.hash.match(/shot=(\d+)/) || [])[1];
goShot(_h ? Math.max(1, Math.min(10, +_h)) : 1, true);
/* #drill=<block-id> 直接打开某个知识块的档案（现场书签 / 截图验收） */
const _d = (location.hash.match(/drill=([A-Za-z0-9_-]+)/) || [])[1];
if (_d) { const _i = B.findIndex(x => x.id === _d); if (_i >= 0) setTimeout(() => openDrill(_i), 700); }
/* #led=all 直接展开全部对照（Q&A 用的「对照总览」/ 截图验收） */
if (/led=all/.test(location.hash)) {
  ledgerAll = true;
  setTimeout(() => renderRight(), 300);
}
setTimeout(() => { spawnQuiet = false; }, 500);
if (/tour=1/.test(location.hash)) setTimeout(() => autoPlay(true), 500);
addEventListener('hashchange', () => {
  const m = location.hash.match(/shot=(\d+)/);
  if (m) { clearInterval(tourTimer); tourTimer = null; $('#play').textContent = '▶ 连播'; goShot(+m[1]); }
});
requestAnimationFrame(loop);
</script>
</body>
</html>
